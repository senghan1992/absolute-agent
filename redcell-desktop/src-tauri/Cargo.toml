[package]
name = "redcell-desktop"
version = "0.1.0"
edition = "2021"
# 바이너리가 2개(main + bin/sweep)라 `cargo run` 대상이 모호해진다.
# `cargo tauri dev` 의 기본 DevCommand(`cargo run --no-default-features`)가
# --bin 없이 실행되므로 기본 실행 대상을 데스크톱 앱으로 고정한다.
# sweep CLI 는 `cargo run --bin sweep -- ...` 으로 그대로 실행한다.
default-run = "redcell-desktop"
description = "RedCell Desktop — 세션별 침투테스트 로그/대화 UI (RedCell 인가 에이전트 프론트엔드)"
authors = ["seunghwan.byun"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
redcell-netfilter = { path = "netfilter" }
# 원시 TLS 전송 (HTTPS %2e) — ureq 와 동일한 잠금 버전 직접 의존 (오프라인 해석용 exact 핀).
# dangerous_configuration: 자체 서명·자체 발급 인증서에도 접속해 버전을 수집하려면
# 검증 통과를 강제하는 verifier 가 필요하다(자체 서명 대상에서 handshake 자체가 실패하면
# 협상 버전·암호군·인증서 정보를 얻을 수 없다). 같은 버전의 기존 crate 이므로 오프라인 영향 없음.
rustls = { version = "=0.21.12", features = ["dangerous_configuration"] }
webpki-roots = "=0.25.4"
# OpenAPI YAML 풀파서 — serde-yaml 공식 유지보수 포크 (서브셋 파서는 폴백 유지).
yaml_serde = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true

[workspace]
members = [".", "netfilter"]
