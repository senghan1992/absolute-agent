[package]
name = "redcell-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
libc = "0.2"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"
ureq = { version = "2", default-features = false, features = ["tls"] }
uuid = { version = "1", features = ["v4"] }
